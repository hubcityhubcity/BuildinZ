name: Verify BuildinZ Genesis gallery browser
on:
  push:
    branches: [main]
    paths:
      - "preview-genesis-gallery.html"
      - "tests/browser_genesis_gallery.mjs"
      - "metadata/genesis-token-registry.json"
      - "design/COLLECTION_REGISTRY.json"
      - "design/ASSET_MANIFEST.json"
      - ".github/workflows/verify-genesis-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run desktop/mobile gallery browser checks
        run: node tests/browser_genesis_gallery.mjs
