name: Verify BuildinZ Genesis gallery browser
on:
  push:
    branches: [main]
    paths:
      - "preview-genesis-gallery.html"
      - "review-crimson-burgundy.html"
      - "assets/editions/**"
      - "index.html"
      - "tests/browser_genesis_gallery.mjs"
      - "metadata/genesis-token-registry.json"
      - "design/COLLECTION_REGISTRY.json"
      - "design/ASSET_MANIFEST.json"
      - ".github/workflows/verify-genesis-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.55.1
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: npx playwright install --only-shell chromium
      - name: Run desktop/mobile gallery browser checks
        run: node tests/browser_genesis_gallery.mjs

      - name: Retain rendered gallery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-gallery-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 30
