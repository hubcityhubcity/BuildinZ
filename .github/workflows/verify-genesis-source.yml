name: Verify BuildinZ Genesis source
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/validate_genesis_registry.py"
      - "scripts/validate_base_coverage.py"
      - "scripts/validate_crimson_editions.py"
      - "design/CRIMSON_COMMONS_EDITION_PLAN.json"
      - "scripts/build_genesis_metadata.mjs"
      - "scripts/verify_collection_labels.py"
      - "design/COLLECTION_CONSISTENCY_STANDARD.md"
      - "tests/test_genesis_gallery.mjs"
      - "tests/test_build_genesis_metadata.mjs"
      - "metadata/genesis-token-registry.json"
      - "design/COLLECTION_REGISTRY.json"
      - "design/ASSET_MANIFEST.json"
      - ".github/workflows/verify-genesis-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical stage labels
        run: python3 scripts/verify_collection_labels.py
      - name: Validate selected base stage coverage
        run: python3 scripts/validate_base_coverage.py
      - name: Validate Crimson edition production plan
        run: python3 scripts/validate_crimson_editions.py
      - name: Validate collection registry
        run: python3 scripts/validate_genesis_registry.py
      - name: Test stage metadata guardrails
        run: node --test tests/test_build_genesis_metadata.mjs
      - name: Test collector gallery source
        run: node --test tests/test_genesis_gallery.mjs
