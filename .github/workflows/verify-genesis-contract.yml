name: Verify BuildinZ draft Polygon contract
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - ".github/workflows/verify-genesis-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned audited dependencies
        run: |
          mkdir -p lib
          git clone -q --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone -q --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git lib/forge-std
      - name: Compile prototype
        run: forge build --sizes
      - name: Run test suite
        run: forge test -vv
