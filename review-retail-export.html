ass="baseline"></span></div><p><a href="assets/candidates/crimson-commons-ruby-galleria-stage-2-v2.png">Open original PNG</a></p><code>927bada9656600d123f4287a4ffab81d7814795e6330367f86067ba9acfd5841</code></figure><figure><h2>Cardinal Exchange</h2><p>Stage 3 · Retail</p><div class="frame"><img width="1024" height="1536" src="assets/candidates/crimson-commons-cardinal-exchange-stage-3-v2.png" alt="Cardinal Exchange full-frame selected architectural candidate"><span class="inset"></span><span class="baseline"></span></div><p><a href="assets/candidates/crimson-commons-cardinal-exchange-stage-3-v2.png">Open original PNG</a></p><code>7194813fe1b909388617a46d4ad76376dab8dff1c5e824470f560c740ba6172a</code></figure></main><script>document.querySelector('#native').onclick=function(){const on=document.body.classList.toggle('native');this.setAttribute('aria-pressed',String(on));this.textContent=on?'Fit to screen':'Use native size'};document.querySelector('#y').oninput=function(){const n=Number(this.value);if(!Number.isFinite(n)||n<0||n>1536)return;document.querySelector('#value').textContent=String(n);document.querySelectorAll('.baseline').forEach(el=>el.style.top=(n/1536*100)+'%')};</script></html>
